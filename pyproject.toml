# Vercel web preview only. The full API/worker still uses requirements.txt.
[project]
name = "photospot-web-preview"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "pillow==12.3.0",
    "korean_lunar_calendar==0.4.0",
    "tzdata==2026.5",
    "uvicorn==0.54.0",
]

# constraints.txt is the version source; scripts.check_dependencies checks this
# deliberately smaller Vercel runtime against it before every deployment.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Start with correctness errors across the entire Python tree, not style churn.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
files = ["api/rate_limit.py", "pipeline/masking.py", "pipeline/tourapi.py"]
follow_imports = "silent"
ignore_missing_imports = true

[tool.vercel]
entrypoint = "deploy.vercel.index:app"

[tool.vercel.fastapi.static]
# The preview middleware protects API responses, not public frontend assets.
cdn = true
exclude = true
