name: data-refresh
on:
  schedule:
    - cron: "0 22 * * *"   # 매일 다음 날 07:00 KST
    - cron: "17 22 * * *"  # 07:17 KST, 정각 실행 누락 시 보완
  workflow_dispatch:
    inputs:
      limit:
        description: "수동 실행 시 확인할 지점 수 (비우면 지정한 3곳 모두)"
        required: false

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  schedule-gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run-refresh: ${{ steps.check.outputs.run-refresh }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timedelta, timezone
          
          def api(path, *params):
              result = subprocess.run(
                  ['gh', 'api', '--method', 'GET', path, *params],
                  check=True, capture_output=True, text=True, timeout=30,
              )
              return json.loads(result.stdout)
          
          def completed_schedule_today():
              day = datetime.now(timezone(timedelta(hours=9))).date()
              since = datetime.combine(day, datetime.min.time(), timezone(timedelta(hours=9)))
              until = since + timedelta(days=1)
              start, end = (d.astimezone(timezone.utc).isoformat().replace('+00:00', 'Z') for d in (since, until))
              repo = os.environ['GITHUB_REPOSITORY']
              runs = api(f'repos/{repo}/actions/workflows/data-refresh.yml/runs',
                         '-f', 'branch=main', '-f', 'event=schedule', '-f', f'created=>={start}', '-F', 'per_page=100')
              for run in runs['workflow_runs']:
                  if (run.get('event') != 'schedule' or run.get('head_branch') != 'main'
                          or run['run_number'] >= int(os.environ['GITHUB_RUN_NUMBER'])
                          or not start <= run['created_at'] < end or run.get('conclusion') != 'success'):
                      continue
                  jobs = api(f"repos/{repo}/actions/runs/{run['id']}/jobs")
                  for job in jobs['jobs']:
                      if job['name'] == 'refresh' and job.get('conclusion') == 'success' and any(
                          step['name'] == 'Confirm complete collection' and step.get('conclusion') == 'success'
                          for step in job.get('steps', [])
                      ):
                          return True
              return False
          
          skip = False
          if os.environ['GITHUB_EVENT_NAME'] == 'schedule' and os.getenv('CRON') == '17 22 * * *':
              try:
                  skip = completed_schedule_today()
              except (subprocess.SubprocessError, OSError, ValueError, KeyError, TypeError):
                  print('예약 완료 기록 조회 불가 · 보완 수집 진행')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('run-refresh=' + ('false' if skip else 'true'), file=out)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print('당일 예약 실행의 3곳 수집 완료 확인 · 보완 수집 생략' if skip else '수집 진행 · 당일 예약 3곳 완료 미확인 또는 본/수동 실행', file=summary)
          PY

  refresh:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run-refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prepare catalog copy and record trigger
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          cp catalog/places.sqlite3 "$RUNNER_TEMP/places.sqlite3"
          echo "PLACE_CATALOG_DB=$RUNNER_TEMP/places.sqlite3" >> "$GITHUB_ENV"
          mkdir -p artifacts
          printf '실행: %s · UTC cron: %s · 실제 시작: %s KST\n' "$GITHUB_EVENT_NAME" "${CRON:-수동}" "$(TZ=Asia/Seoul date '+%F %T')" >> "$GITHUB_STEP_SUMMARY"
      - name: Read pending hours review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.official_hours_pr prepare
      - name: Refresh official dated hours for three branches
        env:
          LIMIT: ${{ inputs.limit }}
        run: python -m pipeline.official_place_hours --daily ${LIMIT:+--limit "$LIMIT"}
      - name: Audit hours coverage
        run: python -m scripts.audit_place_hours
      - name: Regenerate only the manifest
        run: python -m scripts.export_catalog --manifest-only
      - name: Check official hours expiry
        continue-on-error: true
        run: python -m scripts.check_data_freshness --source official_place_hours --fail-within 0 --github
      - name: Report collection status
        if: always() && hashFiles('artifacts/official-hours-import.json') != ''
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path("artifacts/official-hours-import.json").read_text())
          print(f"수집 {r['status']} · 성공 {r['updated']} · 실패 {len(r['failures'])} · 미시도 {r['unattempted']}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: data-refresh-reports
          path: artifacts/*.json
          if-no-files-found: ignore
      - name: Verify changed files and publish review PR
        env:
          GH_TOKEN: ${{ secrets.DATA_REFRESH_TOKEN || github.token }}
        run: python -m scripts.official_hours_pr publish
      - name: Confirm complete collection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/official-hours-import.json').read_text())
          complete = (report['status'] == 'complete' and report['candidates'] == report['attempted'] == report['updated'] == 3
                      and report['unattempted'] == 0 and not report['failures'] and not report['stopped'])
          if not complete:
              raise SystemExit('일부 또는 전체 수집 실패 · 검증된 갱신 PR은 검토 대기 · 보완 수집 필요')
          print('공식 시간표 3곳 수집 완료')
          PY
