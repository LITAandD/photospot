name: data-refresh
# 공식 지점 날짜별 운영시간(7일치 게시)을 매주 다시 받아 PR로 올린다.
# 앱 요청은 외부 사이트를 부르지 않으므로, 이 작업이 멈추면 게시 기간이 지난 시간은 '공식 안내 확인'으로 바뀐다.
on:
  schedule:
    - cron: "17 21 * * 0"          # 매주 월요일 06:17 KST
  workflow_dispatch:
    inputs:
      limit:
        description: "갱신할 지점 수 제한 (비우면 전체)"
        required: false

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write               # 갱신 브랜치 push
      pull-requests: write          # PR 생성
    env:
      BRANCH: data-refresh/official-hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Freshness before refresh
        run: python -m scripts.check_data_freshness
      # 수집 명령은 storage/ 대신 배포 스냅샷 복사본을 읽는다 (원본 storage DB는 저장소에 없다)
      - name: Prepare catalog working copy
        run: |
          echo "PLACE_CATALOG_DB=$RUNNER_TEMP/places.sqlite3" >> "$GITHUB_ENV"
          cp catalog/places.sqlite3 "$RUNNER_TEMP/places.sqlite3"
          mkdir -p artifacts
      # 스타벅스 공식 매장찾기는 인증키가 필요 없다. 직렬 요청, 403/429면 재시도 없이 멈추고 기존 기록을 보존한다.
      - name: Refresh official dated hours
        env:
          LIMIT: ${{ inputs.limit }}
        run: python -m pipeline.official_place_hours ${LIMIT:+--limit "$LIMIT"}
      - name: Audit hours coverage
        run: python -m scripts.audit_place_hours
      - name: Re-export public catalog snapshot and manifest
        run: python -m scripts.export_catalog
      - name: Freshness after refresh
        run: python -m scripts.check_data_freshness --fail-within 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-refresh-reports
          path: artifacts/*.json
          if-no-files-found: ignore
      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git add pipeline/data/official_place_hours.json catalog/places.sqlite3 catalog/places.manifest.json
          if git diff --cached --quiet; then
            echo "변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -m "data: 공식 지점 운영시간 갱신 ($(TZ=Asia/Seoul date +%F))"
          git push --force origin "$BRANCH"
          body="자동 갱신: \`python -m pipeline.official_place_hours\` → \`python -m scripts.export_catalog\`.
          검토 후 병합하세요. GITHUB_TOKEN으로 만든 PR은 CI를 자동 실행하지 않으니 필요하면 PR을 닫았다 다시 열어 주세요."
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "$BASE" --head "$BRANCH" --title "data: 공식 지점 운영시간 갱신" --body "$body" \
              || echo "::warning::PR 생성 실패 (저장소 설정 'Allow GitHub Actions to create pull requests' 확인). 브랜치 $BRANCH 는 push됨"
          fi
