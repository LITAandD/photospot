name: data-refresh
on:
  schedule:
    - cron: "0 22 * * *"   # 매일 다음 날 07:00 KST
    - cron: "17 22 * * *"  # 07:17 KST, 정각 실행 누락 시 보완
  workflow_dispatch:
    inputs:
      limit:
        description: "수동 실행 시 확인할 지점 수 (비우면 지정한 3곳 모두)"
        required: false

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  schedule-gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run-refresh: ${{ steps.check.outputs.run-refresh }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule && "$CRON" == "17 22 * * *" ]]; then
            # 07:00 KST is 22:00 UTC on the previous calendar day.
            since=$(date -u -d "$(TZ=Asia/Seoul date +%F) 07:00:00 +0900" +%FT%TZ)
            if runs=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/data-refresh.yml/runs" \
              -f branch=main -f event=schedule -f "created=>=$since" -F per_page=30) &&
              jq -e --argjson current "$GITHUB_RUN_NUMBER" --arg since "$since" \
              'any(.workflow_runs[]; .run_number < $current and .created_at >= $since and .conclusion == "success")' \
              <<< "$runs" >/dev/null; then
              echo "run-refresh=false" >> "$GITHUB_OUTPUT"
              echo '07:17 KST 보완 실행: 오늘의 앞선 예약 실행 성공으로 수집 생략' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo '07:17 KST 보완 실행: 오늘의 앞선 예약 성공을 확인하지 못해 수집 진행' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "run-refresh=true" >> "$GITHUB_OUTPUT"

  refresh:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run-refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prepare catalog copy and record trigger
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          cp catalog/places.sqlite3 "$RUNNER_TEMP/places.sqlite3"
          echo "PLACE_CATALOG_DB=$RUNNER_TEMP/places.sqlite3" >> "$GITHUB_ENV"
          mkdir -p artifacts
          printf '실행: %s · UTC cron: %s · 실제 시작: %s KST\n' "$GITHUB_EVENT_NAME" "${CRON:-수동}" "$(TZ=Asia/Seoul date '+%F %T')" >> "$GITHUB_STEP_SUMMARY"
      - name: Read pending hours review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.official_hours_pr prepare
      - name: Refresh official dated hours for three branches
        env:
          LIMIT: ${{ inputs.limit }}
        run: python -m pipeline.official_place_hours --daily ${LIMIT:+--limit "$LIMIT"}
      - name: Audit hours coverage
        run: python -m scripts.audit_place_hours
      - name: Regenerate only the manifest
        run: python -m scripts.export_catalog --manifest-only
      - name: Check official hours expiry
        continue-on-error: true
        run: python -m scripts.check_data_freshness --source official_place_hours --fail-within 0 --github
      - name: Report collection status
        if: always() && hashFiles('artifacts/official-hours-import.json') != ''
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path("artifacts/official-hours-import.json").read_text())
          print(f"수집 {r['status']} · 성공 {r['updated']} · 실패 {len(r['failures'])} · 미시도 {r['unattempted']}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: data-refresh-reports
          path: artifacts/*.json
          if-no-files-found: ignore
      - name: Verify changed files and publish review PR
        env:
          GH_TOKEN: ${{ secrets.DATA_REFRESH_TOKEN || github.token }}
        run: python -m scripts.official_hours_pr publish
