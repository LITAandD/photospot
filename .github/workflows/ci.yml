name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: photospot
          POSTGRES_USER: photospot
          POSTGRES_PASSWORD: photospot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U photospot -d photospot"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://photospot:photospot@localhost:5432/photospot
      JWT_SECRET: ci-secret
      STORAGE_ROOT: /tmp/storage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -r requirements-quality.txt
      - run: python -m scripts.check_dependencies
      - run: python -m ruff check api pipeline saju scripts tests
      - run: python -m mypy
      - run: pip check
      - name: Migrate (fresh DB)
        run: python -m scripts.migrate --seed
      - name: Migration rerun and read-only status
        run: |
          python -m scripts.migrate
          python -m scripts.migrate --status
      - name: Test
        run: python -m pytest tests -q
      - name: Photo-to-score integrity (no drift)
        run: python -m pipeline.run integrity
      - name: OpenAPI spec must match code
        run: |
          python -m api.export_openapi --output /tmp/openapi.yaml
          diff -u openapi.yaml /tmp/openapi.yaml

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLACE_CATALOG_DB: ${{ github.workspace }}/artifacts/ci-places.sqlite3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            app/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
        working-directory: client
      - run: npm run types && npm test
        working-directory: client
      - run: git diff --exit-code -- client/src/api.d.ts
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run export -- --max-workers 2
        working-directory: app
      - run: pip install -r requirements-e2e.txt -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Import isolated public-data snapshot for UI tests
        run: python -m scripts.load_catalog_fixture
      - name: Start demo for UI smoke
        run: CI=1 npm --prefix app run demo -- --port 8081 --max-workers 2 > /tmp/photospot-web.log 2>&1 &
      - name: Wait for demo
        id: demo_ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081 > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/photospot-web.log
          exit 1
      - run: python app/e2e/release_smoke.py
      - run: python app/e2e/photo_smoke.py --offline-images
        if: ${{ !cancelled() && steps.demo_ready.outcome == 'success' }}
      - run: python app/e2e/deep_links_smoke.py
        if: ${{ !cancelled() && steps.demo_ready.outcome == 'success' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ui-screenshots
          path: artifacts/screenshots

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: pip install -r requirements-quality.txt
      - run: mkdir -p artifacts/security
      - name: Audit Python runtime (fail on known vulnerabilities)
        run: python -m pip_audit -r requirements.txt --format json --output artifacts/security/python.json
      - name: Audit client (fail on any vulnerability)
        if: ${{ !cancelled() }}
        run: npm --prefix client audit --audit-level=high --json > artifacts/security/client.json
      - name: Audit app (critical gate; existing Expo high/moderate findings remain tracked)
        if: ${{ !cancelled() }}
        run: npm --prefix app audit --audit-level=critical --json > artifacts/security/app.json
      - name: Show unresolved app findings
        if: ${{ !cancelled() }}
        run: |
          node -e "const a=require('./artifacts/security/app.json'); if(!a.metadata) process.exit(1); console.log(a.metadata.vulnerabilities); if(a.metadata.vulnerabilities.high) console.log('::warning::Expo dependency vulnerabilities remain; see security-reports and REVIEW_2026-10-12.md.');"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-reports
          path: artifacts/security

  image:
    needs: [test, app, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize container repository name
        id: image_name
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image_name.outputs.repository }}:latest
            ${{ steps.image_name.outputs.repository }}:${{ github.sha }}
