name: data-freshness
# 배포 자료(공식 날짜별 시간·검수 영업시간)의 만료를 매일 점검해 GitHub 이슈로 알린다. 네트워크 수집은 하지 않는다.
# 만료가 있으면 같은 제목의 이슈를 만들거나 본문을 갱신하고, 다시 모두 유효해지면 닫는다 (제목으로 찾으므로 여러 번 돌아도 이슈는 하나).
# 앱은 만료 자료를 사실처럼 보여 주지 않고 '확인 필요'(또는 최신 지도 등록시간)로 바꾸므로, 이 이슈는 데이터 품질 알림이지 장애는 아니다.
on:
  schedule:
    - cron: "41 22 * * *"          # 매일 07:41 KST (data-refresh 월·목 06:17 KST 이후)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: data-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "데이터 신선도: 운영시간 자료 만료 (자동 점검)"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check expiry of official and reviewed hours
        id: fresh
        # stdout은 표(report.md), stderr는 ::error/::warning 주석. 종료 코드 1이면 만료 자료가 있다
        run: |
          set +e
          python -m scripts.check_data_freshness --fail-within 0 --source official_place_hours --source place_hours --github --markdown | tee report.md
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          { echo "## 데이터 신선도"; echo; cat report.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update issue
        if: steps.fresh.outputs.status != '0'
        run: |
          {
            echo "매일 점검(\`data-freshness\`)에서 만료된 운영시간 자료를 찾았습니다. 앱은 만료 자료를 '확인 필요'로 표시하고, 지도 등록시간이 최신이면 그쪽을 보여 줍니다."
            echo
            cat report.md
            echo
            echo "조치"
            echo "- 공식 날짜별 시간(official_place_hours): \`gh workflow run data-refresh.yml\` 실행 후 생성된 PR을 병합 (Vercel이 main을 다시 배포)"
            echo "- 검수 영업시간(place_hours.json): 출처(네이버지도)에서 다시 확인하고 \`checked_at\`을 확인한 날짜로 갱신해 PR"
            echo "- 절차와 확인 명령: deploy/OPERATIONS.md '만료된 운영시간'"
            echo
            echo "_마지막 점검: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}_"
          } > body.md
          number=$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -1)
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
            echo "이슈 #$number 갱신"
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
      - name: Close issue when data is fresh again
        if: steps.fresh.outputs.status == '0'
        run: |
          number=$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -1)
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "점검 기준으로 운영시간 자료가 다시 모두 유효합니다. (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          else
            echo "열린 이슈 없음"
          fi
