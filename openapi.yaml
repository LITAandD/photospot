openapi: 3.1.0
info:
  title: 포토스팟 추천 API
  description: 퍼스널컬러·체형 기반 사진 명소 추천. 소셜 로그인(/v1/auth/*)으로 받은 액세스 토큰을 Bearer로 보낸다.
  version: 1.2.0
paths:
  /v1/auth/providers:
    get:
      tags:
      - auth
      summary: Configured Providers
      operationId: configured_providers_v1_auth_providers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh
      description: 갱신 토큰으로 새 토큰 쌍. 갱신 토큰은 한 번 쓰면 새것으로 바뀐다.
      operationId: refresh_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      description: 이 기기의 갱신 토큰을 무효화. 액세스 토큰은 수명(기본 1시간)이 끝나면 자동으로 만료
      operationId: logout_v1_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshIn'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/{provider}:
    post:
      tags:
      - auth
      summary: Login
      description: 서비스 토큰을 검증하고 우리 토큰을 발급. 처음이면 계정을 만든다.
      operationId: login_v1_auth__provider__post
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          enum:
          - google
          - apple
          - naver
          - kakao
          type: string
          title: Provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/me/identities:
    get:
      tags:
      - auth
      - me
      summary: Identities
      operationId: identities_v1_me_identities_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/IdentityOut'
                type: array
                title: Response Identities V1 Me Identities Get
  /v1/me/identities/{provider}:
    post:
      tags:
      - auth
      - me
      summary: Link Identity
      description: 로그인된 계정에 다른 로그인 수단을 추가
      operationId: link_identity_v1_me_identities__provider__post
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          enum:
          - google
          - apple
          - naver
          - kakao
          type: string
          title: Provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - auth
      - me
      summary: Unlink Identity
      operationId: unlink_identity_v1_me_identities__provider__delete
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          enum:
          - google
          - apple
          - naver
          - kakao
          type: string
          title: Provider
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/DeleteAccountIn'
              - type: 'null'
              title: Body
      responses:
        '204':
          description: Successful Response
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/me/session:
    get:
      tags:
      - growth
      summary: Session
      operationId: session_v1_me_session_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowthSession'
  /v1/me/instagram:
    get:
      tags:
      - growth
      summary: Instagram
      operationId: instagram_v1_me_instagram_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    delete:
      tags:
      - growth
      summary: Disconnect Instagram
      operationId: disconnect_instagram_v1_me_instagram_delete
      responses:
        '204':
          description: Successful Response
  /v1/me/instagram/authorize:
    post:
      tags:
      - growth
      summary: Authorize Instagram
      operationId: authorize_instagram_v1_me_instagram_authorize_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/social/instagram/callback:
    get:
      tags:
      - growth
      summary: Instagram Callback
      operationId: instagram_callback_v1_social_instagram_callback_get
      parameters:
      - name: state
        in: query
        required: true
        schema:
          type: string
          maxLength: 256
          title: State
      - name: code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 4096
          - type: 'null'
          title: Code
      - name: error
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Error
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/me/billing:
    get:
      tags:
      - growth
      summary: Get Billing
      operationId: get_billing_v1_me_billing_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingStatus'
  /v1/me/billing/sync:
    post:
      tags:
      - growth
      summary: Sync Billing
      operationId: sync_billing_v1_me_billing_sync_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingStatus'
  /v1/feedback:
    post:
      tags:
      - growth
      summary: Submit Feedback
      operationId: submit_feedback_v1_feedback_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackSubmission'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/me/feedback:
    get:
      tags:
      - growth
      summary: My Feedback
      operationId: my_feedback_v1_me_feedback_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FeedbackOut'
                type: array
                title: Response My Feedback V1 Me Feedback Get
  /v1/me/feedback/{feedback_id}:
    delete:
      tags:
      - growth
      summary: Delete Feedback
      operationId: delete_feedback_v1_me_feedback__feedback_id__delete
      parameters:
      - name: feedback_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Feedback Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/feedback:
    get:
      tags:
      - growth
      summary: Feedback Queue
      operationId: feedback_queue_v1_admin_feedback_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FeedbackOut'
                type: array
                title: Response Feedback Queue V1 Admin Feedback Get
  /v1/admin/feedback/{feedback_id}:
    patch:
      tags:
      - growth
      summary: Review Feedback
      operationId: review_feedback_v1_admin_feedback__feedback_id__patch
      parameters:
      - name: feedback_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Feedback Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackReview'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/feedback/triage:
    post:
      tags:
      - growth
      summary: Analyze Feedback
      operationId: analyze_feedback_v1_admin_feedback_triage_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageBatch'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/triages:
    get:
      tags:
      - growth
      summary: List Triages
      operationId: list_triages_v1_admin_triages_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/admin/triages/{triage_id}:
    patch:
      tags:
      - growth
      summary: Decide Triage
      operationId: decide_triage_v1_admin_triages__triage_id__patch
      parameters:
      - name: triage_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Triage Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageDecision'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/campaigns:
    get:
      tags:
      - growth
      summary: Campaigns
      operationId: campaigns_v1_admin_campaigns_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    post:
      tags:
      - growth
      summary: Create Campaign
      operationId: create_campaign_v1_admin_campaigns_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/campaigns/{campaign_id}:
    patch:
      tags:
      - growth
      summary: Approve Campaign
      operationId: approve_campaign_v1_admin_campaigns__campaign_id__patch
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Campaign Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignApproval'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sponsorships:
    get:
      tags:
      - growth
      summary: Sponsorships
      operationId: sponsorships_v1_sponsorships_get
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 39
          minimum: 33
          title: Lat
      - name: lng
        in: query
        required: true
        schema:
          type: number
          maximum: 132
          minimum: 124
          title: Lng
      - name: radius_m
        in: query
        required: false
        schema:
          type: integer
          maximum: 50000
          minimum: 500
          default: 5000
          title: Radius M
      - name: place_group
        in: query
        required: false
        schema:
          type: string
          pattern: ^(all|cafe|travel|festival)$
          default: all
          title: Place Group
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sponsorships/{campaign_id}/events:
    post:
      tags:
      - growth
      summary: Record Event
      operationId: record_event_v1_sponsorships__campaign_id__events_post
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Campaign Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignEvent'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/health:
    get:
      tags:
      - system
      summary: Health
      operationId: health_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/me/profile:
    get:
      tags:
      - me
      summary: Get Profile
      operationId: get_profile_v1_me_profile_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOut'
    put:
      tags:
      - me
      summary: Put Profile
      operationId: put_profile_v1_me_profile_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/me/consents:
    post:
      tags:
      - me
      summary: Grant Consent
      operationId: grant_consent_v1_me_consents_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentIn'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/me/consents/{consent_type}:
    delete:
      tags:
      - me
      summary: Revoke Consent
      operationId: revoke_consent_v1_me_consents__consent_type__delete
      parameters:
      - name: consent_type
        in: path
        required: true
        schema:
          enum:
          - style_profile
          - saju
          - photo_analysis
          - location
          type: string
          title: Consent Type
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/me/saju:
    put:
      tags:
      - me
      summary: Put Saju
      operationId: put_saju_v1_me_saju_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SajuIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SajuOut'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - me
      summary: Delete Saju
      operationId: delete_saju_v1_me_saju_delete
      responses:
        '204':
          description: Successful Response
  /v1/me/type-card:
    get:
      tags:
      - me
      summary: Get Type Card
      operationId: get_type_card_v1_me_type_card_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypeCard'
  /v1/me:
    delete:
      tags:
      - me
      summary: Delete Account
      description: '탈퇴: 계정 행은 ''탈퇴'' 표시로 남겨 같은 토큰을 막고, 개인정보는 모두 삭제.

        본인이 올린 사진(얼굴이 있을 수 있음)은 파일까지 지우고 영향받은 장면은 재집계.'
      operationId: delete_account_v1_me_delete
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/DeleteAccountIn'
              - type: 'null'
              title: Body
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/me/bookmarks:
    get:
      tags:
      - me
      summary: Bookmarks
      operationId: bookmarks_v1_me_bookmarks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Bookmark'
                type: array
                title: Response Bookmarks V1 Me Bookmarks Get
  /v1/me/bookmarks/{place_id}:
    put:
      tags:
      - me
      summary: Save Bookmark
      operationId: save_bookmark_v1_me_bookmarks__place_id__put
      parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Place Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - me
      summary: Remove Bookmark
      operationId: remove_bookmark_v1_me_bookmarks__place_id__delete
      parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Place Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/recommendations:
    get:
      tags:
      - recommend
      summary: Recommend
      operationId: recommend_v1_recommendations_get
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 39
          minimum: 33
          description: 대한민국 범위
          title: Lat
        description: 대한민국 범위
      - name: lng
        in: query
        required: true
        schema:
          type: number
          maximum: 132
          minimum: 124
          title: Lng
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date
      - name: radius_m
        in: query
        required: false
        schema:
          type: integer
          minimum: 500
          default: 5000
          title: Radius M
      - name: time_slot
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - morning
            - midday
            - golden_hour
            - night
            type: string
          - type: 'null'
          title: Time Slot
      - name: use_saju
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Use Saju
      - name: place_group
        in: query
        required: false
        schema:
          enum:
          - all
          - cafe
          - travel
          - festival
          type: string
          default: all
          title: Place Group
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 30
          title: Limit
      - name: photo_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Photo Only
      - name: min_fit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 0
          default: 0
          title: Min Fit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/places/{place_id}:
    get:
      tags:
      - recommend
      summary: Place Detail
      operationId: place_detail_v1_places__place_id__get
      parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Place Id
      - name: date
